edit:()=>`<div class="detail-grid"><section class="tile"><h3 style="margin-top:0">Agency details</h3><form id="agencyEditForm"><div class="two"><div class="form-group"><label class="label">Agency name</label><input class="field" name="name" required value="${attr(a.name)}"></div><div class="form-group"><label class="label">Market</label><input class="field" name="market" value="${attr(a.market)}"></div></div><div class="two"><div class="form-group"><label class="label">Organization type</label><select class="field" name="type">${['Agency','Management','Other'].map(x=>`<option ${a.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group"><label class="label">Intake policy</label><select class="field" name="policy">${[['unknown','Not verified'],['open-email','Official email intake'],['form','Official form'],['closed','No unsolicited submissions']].map(([x,t])=>`<option value="${x}" ${a.policy===x?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="two"><div class="form-group"><label class="label">Website</label><input class="field" name="website" type="url" value="${attr(a.website)}"></div><div class="form-group"><label class="label">Submissions URL</label><input class="field" name="submitUrl" type="url" value="${attr(a.submitUrl)}"></div></div><div class="two"><div class="form-group"><label class="label">Verified submission email (only if allowed)</label><input class="field" name="contact" type="email" value="${attr(a.contact)}"></div><div class="form-group"><label class="label">Contact or department</label><input class="field" name="contactName" value="${attr(a.contactName)}"></div></div><div class="form-group"><label class="label">Submission subject rule</label><input class="field" name="subjectRule" value="${attr(a.subjectRule)}"></div><div class="form-group"><label class="label">Summary</label><textarea class="area" name="summary">${esc(a.summary)}</textarea></div><div class="form-group"><label class="label">Requirements</label><textarea class="area" name="requirements">${esc(a.requirements)}</textarea></div><div class="form-group"><label class="label">Specialties (comma separated)</label><input class="field" name="focus" value="${attr(a.focus.join(', '))}"></div><div class="form-group"><label class="label">Intake verified on</label><input class="field" type="date" name="policyChecked" value="${attr(a.policyChecked)}"></div><button class="btn" type="submit">Save agency details</button></form></section><aside class="tile"><h3 style="margin-top:0">Your subjective fit ratings</h3><p class="subtitle">Rate 0–5. These ratings are personal estimates, not independently verified agency rankings.</p>${Object.entries({fit:'Career alignment',opportunity:'Opportunity in your market',access:'Permitted access',reputation:'Credibility / evidence',connection:'Relationship potential'}).map(([k,t])=>`<div class="form-group"><div class="meter-label"><label for="rating-${k}">${t}</label><b id="value-${k}">${a.ratings[k]}</b></div><input style="width:100%;accent-color:#167b68" id="rating-${k}" data-rating="${k}" type="range" min="0" max="5" step="1" value="${a.ratings[k]}"></div>`).join('')}<button class="btn secondary small" data-action="delete-agency" style="margin-top:14px">Remove agency from workspace</button></aside></div>`}[detailTab]();return wrap('Agency dossier','Public facts and personal judgments remain separate. Every outreach decision should follow current agency rules.',general+content,`<button class="btn secondary" data-view="discover">← Back to agencies</button>`,'AGENCY INTELLIGENCE / DOSSIER')}
function researchLinks(a){let q=encodeURIComponent('"'+a.name+'" talent agency');return [{label:'Official website',url:url(a.website)||'https://www.google.com/'},{label:'SAG-AFTRA franchised agent directory',url:'https://www.sagaftra.org/contracts-industry-resources/agents-managers/about-professional-representatives/franchised-agents-list'},{label:'Search agency roster and recent projects',url:'https://www.google.com/search?q='+q+'+clients+IMDb+film+television'},{label:'Search submission rules',url:'https://www.google.com/search?q='+q+'+representation+submissions'},{label:'Search independent actor discussions',url:'https://www.google.com/search?q=site%3Areddit.com%2Fr%2Facting+'+q},{label:'Search news and changes',url:'https://www.google.com/search?q='+q+'+agency+2026+news'}]}
function promptText(a){return `Conduct a fresh, evidence-based representation-fit investigation of ${a.name} (${a.website}), relevant to an actor based in ${state.profile.market||'New York'} seeking ${state.profile.goals.join(' and ')||'representation'}. Actor background: ${state.profile.credits||'[awaiting credit list]'}; positioning: ${state.profile.pitch||'[awaiting positioning]'}.

Research independently and cite direct URLs with access dates. REQUIRED:
1. Confirm real current entity, markets, departments, active vs closed status, leadership, individual reps, SAG-AFTRA franchised status if agent (do not apply to managers).
2. Read the current official submissions page. Identify whether unsolicited submissions are accepted, exact permitted channel, specific submission recipient, division, subject and required assets. If unknown, SAY UNKNOWN and recommend no unsolicited email.
3. Analyze actual roster/client credits with recent date evidence, overlap with actor's type and realistic opportunity lanes. Do not assume client is still represented based on old articles.
4. Compare positioning vs at least 3 peer agencies in the same market, where evidence allows.
5. Check independent reports, complaints, reputational concerns, licensing where relevant. Treat anonymous allegations as allegations, not verified fact.
6. Suggest 2-3 truthful pitch angles tied to actor's real credits, explaining why this agency specifically, without fabricated familiarity or false principal-role claims.
7. Present a dossier with Facts / Inferences / Unknowns / Risks, primary sources, latest checks, and go / research further / no cold submission recommendation.
Never invent a contact email, buying intent, client roster, acceptance status, or guarantee of representation. Do not send email or contact anyone.`}
function pipeline(){const c=counted();const stages=['research','ready','draft','sent','reply','meeting','signed','pass'];let total=state.agencies.length||1;return wrap('Outreach pipeline','A decision log for the whole representation search. You—not an automated sender—control every submission.',`<div class="metrics"><div class="tile"><div class="metric-label">Tracked</div><div class="metric-value">${c.all}</div></div><div class="tile"><div class="metric-label">Contacted</div><div class="metric-value">${c.outreach}</div></div><div class="tile"><div class="metric-label">Replied</div><div class="metric-value">${c.reply}</div></div><div class="tile"><div class="metric-label">Meetings / signed</div><div class="metric-value">${c.meeting}</div></div></div><div class="tile"><h3 style="margin:0;font-size:14px">Submission journey</h3><div class="bar-stack">${stages.map((s,i)=>`<span title="${stageLabels[s]}" style="width:${state.agencies.filter(a=>a.stage===s).length/total*100}%;background:${['#bfc9c3','#519f89','#77a8b7','#54849e','#e1af62','#5caa86','#1d785c','#c7d1cb'][i]}"></span>`).join('')}</div><div class="pipeline-legend">${stages.map(s=>`<span class="entry"><b>${state.agencies.filter(a=>a.stage===s).length}</b> ${stageLabels[s]}</span>`).join('')}</div></div><div class="section-head"><h3>Every agency, one accountable status</h3><button class="text-link" data-view="discover">Agency database →</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Agency</th><th>Submission policy</th><th>Status</th><th>Last contact</th><th>Next step</th><th></th></tr></thead><tbody>${state.agencies.map(a=>`<tr><td><button class="name" data-agency="${attr(a.id)}">${esc(a.name)}</button><span class="mini-note">${esc(a.market)}</span></td><td>${policyChip(a.policy)}</td><td>${stageChip(a.stage)}</td><td>${dateString(a.lastContact)}</td><td>${esc(a.nextAction||'—')}</td><td><button class="btn secondary small" data-agency="${attr(a.id)}" data-tab="outreach">Update →</button></td></tr>`).join('')}</tbody></table></div><div class="section-head"><h3>Outcome metrics that matter</h3></div><div class="info">Open and click tracking are intentionally absent: email privacy protections can generate misleading opens, and clicks do not equal agent interest. This workspace measures confirmed responses, meetings and representation decisions.</div>`,'','OUTREACH / RESULTS / NEXT STEPS')}
function draftFor(a,tone=emailTone){const p=state.profile;let firstname=(a.contactName||'').split(' ')[0];const greeting=firstname&&!/team|submissions|intake|unknown|on-camera|adult|no/i.test(a.contactName)?`Hi ${firstname},`:'Hello,';let achievement=p.credits?.trim()||'[your strongest accurately described screen/theatre/commercial credits]';let link=p.reel||p.casting||p.website||'[your reel or casting profile URL]';let hook=(a.dossier.angle&&!/only reference|direct the pitch|choose the division|potential cross|research legitimate|not researched/i.test(a.dossier.angle))?a.dossier.angle:'I believe my work could align with your '+(a.focus.includes('Film / TV')?'film and television':'talent')+' division.';let subject=`${p.name||'[Actor Name]'} — ${p.goals[0]||'Representation'} Representation Inquiry`;
if(a.subjectRule){subject=a.subjectRule.replace('[YOUR NAME]',p.name||'[Actor Name]').replace('[DEPARTMENT]',p.goals.includes('Film / TV')?'LEGIT':(p.goals[0]||'LEGIT').toUpperCase())}
let opening=tone==='warm'?'I hope you’re having a good week. I’m reaching out because I’m exploring representation that fits the direction of my career.':tone==='concise'?'I’m seeking representation and thought my experience might be relevant to your team.':'I’m an actor based in '+(p.market||'[city]')+' seeking '+(p.goals.join(' / ')||'[type of]')+' representation.';
let body=`${greeting}\n\n${opening}\n\n${achievement}\n\n${hook}\n\nMaterials: ${link}${p.headshot?'\nHeadshot: '+p.headshot:''}${p.resume?'\nRésumé: '+p.resume:''}${p.imdb?'\nIMDb: '+p.imdb:''}\n\nIf there’s a potential fit, I’d welcome the chance to speak. Thank you for considering my materials.\n\n${p.name||'[Your name]'}${p.phone?'\n'+p.phone:''}${p.email?'\n'+p.email:''}`;
return {subject,body};}
function composeValid(a){const p=state.profile;let errors=[];if(!p.name.trim())errors.push('add your full actor name');if(!p.credits.trim())errors.push('enter accurate, representative credits');if(!p.reel&&!p.casting&&!p.website)errors.push('provide at least one portfolio/reel/casting link');if(!p.email.trim())errors.push('add your sender contact email');if(a.policy!=='open-email'||!a.contact)errors.push('verify an officially permitted email submission route');if(!a.policyChecked)errors.push('confirm the current intake policy');return errors}
function composer(){let a=state.agencies.find(x=>x.id===composerId)||state.agencies[0];if(!a)return wrap('Pitch studio','Start by adding an agency.','<div class="empty">No agency yet.</div>');let draft=draftFor(a),problems=composeValid(a);return wrap('Pitch studio','One persuasive email based on the actual actor and actual agency—not a mass-submission template.',`<div class="detail-grid"><section class="tile"><div class="two"><div class="form-group"><label class="label">Representative / organization</label><select class="field" id="composerAgency">${state.agencies.map(x=>`<option value="${attr(x.id)}" ${a.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="form-group"><label class="label">Writing style</label><select class="field" id="emailTone">${[['grounded','Grounded / professional'],['warm','Warm / human'],['concise','Concise / direct']].map(([v,n])=>`<option value="${v}" ${emailTone===v?'selected':''}>${n}</option>`).join('')}</select></div></div><div class="form-group"><label class="label">Recipient</label><input class="field" readonly value="${attr(a.policy==='open-email'?a.contact:a.policy==='form'?'Official form required':'No permitted email verified')}"></div><div class="form-group"><label class="label">Subject</label><input class="field" id="draftSubject" value="${attr(draft.subject)}"></div><div class="form-group"><label class="label">Email body — editable before use</label><textarea id="draftBody" class="area composer-mail">${esc(draft.body)}</textarea></div><div class="status-line"><button class="btn" data-action="copy-email">Copy pitch</button><button class="btn secondary" data-action="open-email" ${problems.length?'disabled':''}>Open in mail app ↗</button><button class="btn secondary" data-action="mark-drafted">Mark drafted</button></div><p class="hint">Opening your mail app does not mean an email was sent. Headshot and résumé links are not file attachments; attach files manually if the agency requires them.</p></section><aside><div class="tile">${policyGuard(a)}<div class="section-head"><h3>Pre-send checklist</h3></div>${problems.length?`<div class="callout warning">Finish before opening a submission: <ul>${problems.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'<div class="callout success">Your basic actor/profile and allowed email route fields are present. You must still review the live policy and all claims before sending.</div>'}<p class="hint">Your draft uses any manually researched angle. Remove generic or unproven statements. Never misrepresent background/stand-in/photo-double work as principal acting roles.</p><button class="btn secondary small" data-view="profile">Edit actor profile</button><div class="section-head"><h3>Learn about the agency</h3></div><button class="btn secondary small" data-agency="${attr(a.id)}" data-tab="research">Open research dossier →</button></div></aside></div>`,'','PITCH / REVIEW / APPROVE')}
function profile(){const p=state.profile;return wrap('Your actor profile','Keep your facts and links consistent. Everything is stored in your browser, not an external service.',`<div class="detail-grid"><section class="tile"><form id="profileForm"><div class="two"><div class="form-group"><label class="label">Professional name</label><input name="name" class="field" value="${attr(p.name)}" placeholder="Name on your acting materials"></div><div class="form-group"><label class="label">Primary market</label><input name="market" class="field" value="${attr(p.market)}"></div></div><div class="two"><div class="form-group"><label class="label">Union status</label><select name="union" class="field">${['SAG-AFTRA','SAG-AFTRA Eligible','Nonunion','AEA','Other'].map(x=>`<option ${p.union===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group"><label class="label">Representation goals (comma-separated)</label><input name="goals" class="field" value="${attr(p.goals.join(', '))}"></div></div><div class="form-group"><label class="label">Positioning — what makes you castable?</label><textarea class="area" name="pitch" placeholder="The roles, strengths and qualities you want agents to understand">${esc(p.pitch)}</textarea></div><div class="form-group"><label class="label">Accurate credits and career highlights</label><textarea class="area" name="credits" placeholder="Include role category (principal/featured BG/stand-in/photo double), title, and what can be publicly verified">${esc(p.credits)}</textarea><p class="hint">Use accurate billing/role categories: featured background does not automatically equal principal acting.</p></div><div class="two"><div class="form-group"><label class="label">Reel URL</label><input class="field" name="reel" value="${attr(p.reel)}" type="url"></div><div class="form-group"><label class="label">Headshot URL</label><input class="field" name="headshot" value="${attr(p.headshot)}" type="url"></div></div><div class="two"><div class="form-group"><label class="label">Résumé URL</label><input class="field" name="resume" value="${attr(p.resume)}" type="url"></div><div class="form-group"><label class="label">Actors Access / casting profile</label><input class="field" name="casting" value="${attr(p.casting)}" type="url"></div></div><div class="two"><div class="form-group"><label class="label">IMDb profile</label><input class="field" name="imdb" value="${attr(p.imdb)}" type="url"></div><div class="form-group"><label class="label">Portfolio / website</label><input class="field" name="website" value="${attr(p.website)}" type="url"></div></div><div class="two"><div class="form-group"><label class="label">Contact email</label><input class="field" name="email" type="email" value="${attr(p.email)}"></div><div class="form-group"><label class="label">Phone (optional)</label><input class="field" name="phone" value="${attr(p.phone)}"></div></div><div class="form-group"><label class="label">Existing representation / exclusions</label><input class="field" name="activeReps" value="${attr(p.activeReps)}" placeholder="Avoid contacting existing reps or conflicting divisions"></div><div class="form-group"><label class="label">Career strategy notes</label><textarea class="area" name="notes">${esc(p.notes)}</textarea></div><button class="btn" type="submit">Save profile</button></form></section><aside class="tile"><h3 style="margin-top:0">The asset readiness check</h3><p class="subtitle">Make every agency submission reflect the type of work you actually want.</p>${[['Name',!!p.name],['Experience summary',!!p.credits],['Acting reel',!!p.reel],['Headshot link',!!p.headshot],['Résumé link',!!p.resume],['Casting or website',!!(p.casting||p.website)],['Sender email',!!p.email]].map(([k,b])=>`<div class="process-row"><div class="process-index" style="background:${b?'#dcf3e6':'#f0f1ee'};color:${b?'#267e61':'#a1aca6'}">${b?'✓':'·'}</div><strong>${k}</strong></div>`).join('')}<div class="info" style="margin-top:18px">Sensitive career materials are not uploaded to this prototype. Only URLs and text you enter are stored locally. Export a backup before clearing browser data.</div></aside></div>`,'','ACTOR IDENTITY / MATERIALS')}
function settings(){const ws=state.weights;return wrap('Your rules, your strategy.','Adjust how agencies are compared. You can export all your records or import a previous backup.',`<div class="detail-grid"><section class="tile"><h3 style="margin-top:0">Custom fit-scoring weights</h3><p class="subtitle">These are your priorities, not an objective rating system. Changing them recalculates every agency score.</p><div class="weights" style="margin-top:22px">${Object.entries({fit:'Career alignment',opportunity:'Opportunity',access:'Access / policies',reputation:'Trust / evidence',connection:'Relationships'}).map(([k,l])=>`<div class="weight-row"><label for="weight-${k}">${l}</label><input type="range" id="weight-${k}" data-weight="${k}" min="0" max="50" step="5" value="${ws[k]}"><b id="wval-${k}">${ws[k]}</b></div>`).join('')}</div><p class="hint" style="margin-top:20px">A high fit score cannot override a closed or unknown submission policy.</p><button class="btn secondary small" data-action="reset-weights">Restore default weights</button><div class="section-head"><h3>Data portability</h3></div><div class="status-line"><button class="btn" data-action="export">Download full JSON backup</button><button class="btn secondary" data-action="import">Import JSON backup</button><button class="btn secondary" data-action="csv">Export agency CSV</button></div><div class="section-head"><h3>Privacy controls</h3></div><div class="callout">No external accounts, no automated email, no tracking pixels, no server database. Browser storage can be wiped; keep a JSON backup. External research buttons open third-party pages under their own policies.</div><button class="btn danger small" style="margin-top:15px" data-action="reset-app">Reset all local data</button></section><aside class="tile"><h3 style="margin-top:0">Future connection options</h3><div class="process-row"><div class="process-index">→</div><div><strong>Evidence-first research agent</strong><small>Scheduled public-site research, source capture, freshness checks and citations.</small></div></div><div class="process-row"><div class="process-index">→</div><div><strong>Gmail draft integration</strong><small>Create individual drafts only with explicit approval and OAuth permissions.</small></div></div><div class="process-row"><div class="process-index">→</div><div><strong>Reply and meeting signals</strong><small>Optional connected inbox/calendar, audited consent and deduplicated follow-up queue.</small></div></div><div class="process-row"><div class="process-index">→</div><div><strong>Roster match engine</strong><small>Compare current clients/credits, archetypes and market opportunities using actual cited records.</small></div></div><p class="hint">Roadmap only. These integrations are not implemented in this offline MVP.</p></aside></div>`,'','DATA CONTROL / PERSONALIZATION')}
function go(v){view=v;render();window.scrollTo({top:0,behavior:'instant'})}
function openAgency(id,tab='overview'){selectedId=id;detailTab=tab;go('detail')}
function openModal(title,content){$('#modalHost').innerHTML=`<div class="dialog-backdrop"><div class="dialog" role="dialog" aria-modal="true" aria-label="${attr(title)}"><div class="dialog-head"><h3>${esc(title)}</h3><button class="x" data-action="close-modal" aria-label="Close">×</button></div>${content}</div></div>`}
function closeModal(){$('#modalHost').innerHTML=''}
function addAgency(){openModal('Add an agency / management firm',`<form id="addAgencyForm"><div class="two"><div class="form-group"><label class="label">Company name</label><input name="name" required class="field" placeholder="Agency name"></div><div class="form-group"><label class="label">Market</label><input name="market" class="field" value="New York"></div></div><div class="form-group"><label class="label">Official website</label><input name="website" type="url" class="field" required placeholder="https://..."></div><div class="form-group"><label class="label">Organization category</label><select name="type" class="field"><option>Agency</option><option>Management</option><option>Other</option></select></div><p class="callout">New agency entries default to <strong>submission policy unverified</strong>. No outgoing email until you confirm the official intake channel.</p><div class="dialog-foot"><button type="button" class="btn secondary" data-action="close-modal">Cancel</button><button class="btn" type="submit">Create research dossier</button></div></form>`)}
function download(name,content,mime='application/json'){let blob=new Blob([content],{type:mime});let loc=URL.createObjectURL(blob);let a=document.createElement('a');a.href=loc;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(loc),1000)}
function asCSV(x){let v=String(x??'');if(/^[=+@\-\t\r]/.test(v))v="'"+v;return '"'+v.replaceAll('"','""')+'"'}
function captureDraft(){return {subject:$('#draftSubject')?.value||'',body:$('#draftBody')?.value||''}}
function mailto(a){let {subject,body}=captureDraft();let address=a.contact.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(address)){toast('Invalid recipient address');return}let href=`mailto:${encodeURIComponent(address)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;if(href.length>1900){toast('This pitch may be too long for mailto. Use Copy pitch instead.');return}window.location.href=href;toast('Mail app opened, not sent. Confirm sending there.');}
function safeImport(raw){if(!raw||raw.version!==1||!raw.profile||!raw.weights||!Array.isArray(raw.agencies)||raw.agencies.length>2500)throw new Error('Invalid or unsupported backup');for(let a of raw.agencies){if(!a||typeof a.id!=='string'||typeof a.name!=='string'||!Array.isArray(a.sources)||!a.dossier||!a.ratings||typeof a.policy!=='string')throw new Error('Malformed agency entry')}return raw}
function formData(form){return Object.fromEntries(new FormData(form).entries())}
function bind(){document.addEventListener('click',ev=>{let el=ev.target.closest('[data-view],[data-agency],[data-detail-tab],[data-compose],[data-action]');if(!el)return;if(el.matches('[data-view]')){go(el.dataset.view);return}if(el.matches('[data-agency]')){openAgency(el.dataset.agency,el.dataset.tab||'overview');return}if(el.matches('[data-detail-tab]')){detailTab=el.dataset.detailTab;render();return}if(el.matches('[data-compose]')){composerId=el.dataset.compose;go('composer');return}let act=el.dataset.action;switch(act){case 'close-modal':closeModal();break;case 'add-agency':addAgency();break;case 'export':download('rep-atlas-backup-'+stamp()+'.json',JSON.stringify(state,null,2));toast('Backup prepared');break;case 'csv':download('rep-atlas-agencies-'+stamp()+'.csv','Agency,Market,Type,Policy,Email,Status,Fit Score,Website,Last Contact,Next Action,Source Count\r\n'+state.agencies.map(a=>[a.name,a.market,a.type,a.policy,a.contact,a.stage,score(a),a.website,a.lastContact,a.nextAction,a.sources.length].map(asCSV).join(',')).join('\r\n'),'text/csv');toast('CSV prepared');break;case 'import':$('#importFile').click();break;case 'reset-weights':state.weights=initial().weights;save();render();toast('Scoring weights restored');break;case 'reset-app':if(confirm('Erase your saved local profile, research notes and pipeline? Download a backup first.')){state=initial();save();go('overview');toast('Local data reset')}break;case 'remove-source':{let a=agency();if(confirm('Remove this source?')){a.sources.splice(Number(el.dataset.sourceIndex),1);save();render()}break;}case 'delete-agency':{let a=agency();if(confirm('Remove '+a.name+' and all its research from your local workspace?')){state.agencies=state.agencies.filter(x=>x.id!==a.id);save();go('discover');toast('Agency removed')}break;}case 'save-dossier':{let a=agency();$$('[data-dossier]').forEach(x=>a.dossier[x.dataset.dossier]=x.value);save();toast('Research notes saved');break;}case 'save-status':{let a=agency();a.stage=$('#agencyStage').value;a.lastContact=$('#lastContact').value;a.nextAction=$('#nextAction').value;state.activity.unshift({type:'status',agency:a.name,date:stamp(),status:a.stage});save();render();toast('Status saved');break;}case 'copy-research-prompt':{let p=promptText(agency());navigator.clipboard?.writeText(p).then(()=>toast('Research brief copied')).catch(()=>fallbackCopy(p));if(!navigator.clipboard)fallbackCopy(p);break;}case 'copy-email':{let d=captureDraft();let s=`Subject: ${d.subject}\n\n${d.body}`;navigator.clipboard?.writeText(s).then(()=>toast('Email copied')).catch(()=>fallbackCopy(s));if(!navigator.clipboard)fallbackCopy(s);break;}case 'open-email':{let a=state.agencies.find(x=>x.id===composerId);let issues=composeValid(a);if(issues.length){toast('Complete the pre-send checklist first');return}if(!confirm('Reconfirm the official intake policy and approve opening this draft in your mail app? This does not send it.'))return;mailto(a);break;}case 'mark-drafted':{let a=state.agencies.find(x=>x.id===composerId);if(a.policy==='closed'){toast('No unsolicited contact permitted. Cannot mark as a cold-submission draft.');return}a.stage='draft';save();toast('Draft status recorded');break;}}});
document.addEventListener('submit',ev=>{let form=ev.target;ev.preventDefault();let d=formData(form);if(form.id==='addAgencyForm'){if(!url(d.website)){toast('Enter a valid https:// agency website');return}let a={id:uniq(),name:d.name.trim(),market:d.market||'Unknown',type:d.type,focus:[],summary:'New agency: research not yet completed.',website:d.website,submitUrl:d.website,policy:'unknown',contact:'',contactName:'Not yet verified',subjectRule:'',requirements:'Check official submissions instructions before outreach.',policyChecked:'',stage:'research',ratings:{fit:3,opportunity:3,access:0,reputation:1,connection:0},dossier:{roster:'Unknown',projects:'Unknown',people:'Unknown',positioning:'Unknown',reputation:'Unknown',angle:'Unknown',notes:''},sources:[],tasks:{},lastContact:'',nextAction:''};state.agencies.push(a);save();closeModal();openAgency(a.id,'research');toast('Research dossier created');}
if(form.id==='sourceForm'){if(!url(d.url)){toast('Use a valid https:// source link');return}agency().sources.push({title:d.title.trim(),url:d.url,note:d.note.trim(),date:stamp()});save();render();toast('Evidence source recorded')}
if(form.id==='agencyEditForm'){let a=agency();for(let k of ['name','market','type','website','submitUrl','contact','contactName','subjectRule','summary','requirements','policyChecked'])a[k]=d[k]?.trim()||'';a.focus=(d.focus||'').split(',').map(x=>x.trim()).filter(Boolean);if(d.policy!==a.policy){a.policy=d.policy;a.policyChecked='';a.tasks.policy=false;a.tasks.contact=false;toast('Policy changed. Verification reset; check sources before outreach.')}save();render();toast('Agency details updated')}
if(form.id==='profileForm'){state.profile={...state.profile,...d,goals:(d.goals||'').split(',').map(x=>x.trim()).filter(Boolean)};save();render();toast('Profile saved locally')}});
document.addEventListener('change',ev=>{let el=ev.target;if(el.id==='policyFilter'){filterPolicy=el.value;render()}if(el.id==='composerAgency'){composerId=el.value;render()}if(el.id==='emailTone'){emailTone=el.value;render()}if(el.dataset.task){let a=agency();a.tasks[el.dataset.task]=el.checked;save();}if(el.dataset.rating){agency().ratings[el.dataset.rating]=Number(el.value);save();$('#value-'+el.dataset.rating).textContent=el.value;}if(el.dataset.weight){state.weights[el.dataset.weight]=Number(el.value);save();$('#wval-'+el.dataset.weight).textContent=el.value}});
document.addEventListener('input',ev=>{let el=ev.target;if(el.id==='agencySearch'){filter=el.value;let cursor=el.selectionStart;render();let n=$('#agencySearch');n.focus();n.setSelectionRange(cursor,cursor)}});
$('#importFile').addEventListener('change',async ev=>{let f=ev.target.files?.[0];if(!f)return;try{let data=safeImport(JSON.parse(await f.text()));if(!confirm('Replace all current local data with this backup? Export a copy first if needed.'))return;state=data;save();go('overview');toast('Backup imported')}catch(e){toast('Import failed: '+e.message)}finally{ev.target.value=''}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal()});}
function fallbackCopy(t){let area=document.createElement('textarea');area.value=t;area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();try{document.execCommand('copy');toast('Copied')}catch(e){toast('Copy unavailable. Select text manually.')}area.remove()}
bind();render();
})();

</script>
</body>
</html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mary Kate — isolated live test</title><style>body{font:16px/1.5 system-ui;margin:20px auto;max-width:650px;padding:12px}button{padding:14px;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eee;padding:15px}</style><h1>Mary Kate · Case E</h1><p>Authenticated one-request Workers AI test. No GitHub writes, approval queue writes, or D1 test records. The response remains on this screen until copied. Uses the existing free-tier Workers AI binding; no paid fallback.</p><p><strong>Question:</strong> Should this be in Cloudflare Preview?</p><button id="run">Run one test</button><pre id="result">Not run</pre><button id="copy">Copy receipt</button><script>const b=document.getElementById('run'),r=document.getElementById('result');b.onclick=async()=>{b.disabled=true;r.textContent='Running one authorized model request…';try{const x=await fetch('/api/control/acceptance/case-e',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});r.textContent=JSON.stringify({http_status:x.status,receipt:await x.json()},null,2)}catch(e){r.textContent=JSON.stringify({status:'BLOCKED',reason:e.message})}finally{b.disabled=false}};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(r.textContent)}catch{r.textContent+='\nCopy unavailable; select text manually.'}}</script>

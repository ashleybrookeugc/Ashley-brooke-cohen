<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Work · Mary Kate</title>
<style>:root{font-family:Inter,system-ui,sans-serif;color:#211d1d;background:#f7f3ef}*{box-sizing:border-box}body{margin:0}.shell{max-width:980px;margin:auto;padding:22px}header,.source-line,.card-top{display:flex;justify-content:space-between;gap:14px;align-items:center}h1{margin:.25rem 0}.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#805d53}.muted{color:#746b67;font-size:.9rem}.summary{max-width:680px}.toolbar{display:flex;gap:9px;align-items:center}button{font:inherit;border:0;border-radius:999px;padding:9px 14px;background:#2e2927;color:white;cursor:pointer}a{color:#5f4036}.tabs{display:flex;gap:8px;overflow:auto;padding:12px 0}.tabs button{background:#eee5e0;color:#332b28;white-space:nowrap}.tabs button[aria-selected="true"]{background:#2e2927;color:white}.panel[hidden]{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:13px}.card{background:white;border:1px solid #e1d7d1;border-radius:16px;padding:16px;box-shadow:0 3px 14px #5b41320d}.card h3{margin:.35rem 0}.badge{border-radius:999px;padding:.26rem .55rem;font-size:.72rem;font-weight:700;background:#eee5e0}.status-active-now{background:#dff4e7;color:#185b35}.status-active-parallel{background:#e2ebf8;color:#264c7b}.status-waiting-for-ashley{background:#f5edcf;color:#6a5315}.status-blocked{background:#f9dddd;color:#7b2323}.fact{border-top:1px solid #eee2dc;padding-top:10px;margin-top:10px}.fact strong{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:#805d53}.source{overflow-wrap:anywhere}.empty{background:white;border:1px dashed #cbbdb6;border-radius:14px;padding:16px}.loading{opacity:.65}@media(max-width:640px){.shell{padding:15px}header,.source-line{align-items:flex-start;flex-direction:column}.toolbar{width:100%;justify-content:space-between}.grid{grid-template-columns:1fr}}</style></head>
<body><main class="shell"><header><div><div class="eyebrow">Private · read-only</div><h1>My Work</h1><p class="muted summary">Current work from Project Truth, with source-backed blockers, next actions, approved later work, and verified completion receipts.</p></div><div class="toolbar"><button id="refresh" type="button">Refresh</button><a href="/admin/logout">Sign out</a></div></header>
<p class="muted source-line"><span id="freshness" aria-live="polite">Loading current sources…</span><span>Nothing on this page changes canonical work.</span></p>
<nav class="tabs" aria-label="My Work views"><button type="button" data-tab="work" aria-selected="true">Current work</button><button type="button" data-tab="deferred" aria-selected="false">Approved for later</button><button type="button" data-tab="complete" aria-selected="false">Verified completion</button></nav>
<section class="panel" data-panel="work"><div class="grid" id="work" aria-live="polite"></div></section>
<section class="panel" data-panel="deferred" hidden><div class="grid" id="deferred" aria-live="polite"></div></section>
<section class="panel" data-panel="complete" hidden><div class="grid" id="complete" aria-live="polite"></div></section>
</main><script>
const refresh=document.getElementById('refresh');const freshness=document.getElementById('freshness');const work=document.getElementById('work');const deferred=document.getElementById('deferred');const complete=document.getElementById('complete');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const css=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');const empty=message=>'<p class="empty muted">'+esc(message)+'</p>';function evidence(source){return source?'<details class="fact"><summary>Source evidence</summary><p class="muted source">'+esc(source.repo+'/'+source.path+' @ '+source.sha.slice(0,7))+'</p></details>':''}function workCard(item){return '<article class="card"><div class="card-top"><div class="eyebrow">Workstream</div><span class="badge status-'+css(item.status)+'">'+esc(item.status)+'</span></div><h3>'+esc(item.name)+'</h3><p>'+esc(item.summary||'No current summary recorded.')+'</p>'+(item.blocker?'<p class="fact"><strong>Blocker / waiting on</strong>'+esc(item.blocker)+'</p>':'')+'<p class="fact"><strong>Next</strong>'+esc(item.next||'No next action recorded.')+'</p>'+evidence(item.source)+'</article>'}function deferredCard(item){return '<article class="card"><div class="eyebrow">'+esc(item.approval||item.status||'Approved for later')+'</div><h3>'+esc(item.label)+'</h3>'+evidence(item.source)+'</article>'}function completionCard(item){return '<article class="card"><div class="eyebrow">'+esc(item.scope)+'</div><h3>'+esc(item.label)+'</h3><p class="fact"><strong>Verified</strong>'+esc(item.verified_at||'Time unavailable')+'</p><p class="muted source">Commit '+esc(item.commit_sha)+'</p>'+evidence(item.source)+'</article>'}async function load(){refresh.disabled=true;document.body.classList.add('loading');try{const response=await fetch('/api/control/my-work',{headers:{accept:'application/json'}});const data=await response.json();if(!response.ok)throw Error(data.error||'My Work is unavailable');work.innerHTML=data.work.map(workCard).join('')||empty('No current workstreams are recorded.');const later=[...data.approved_deferred,...data.promoted];deferred.innerHTML=later.map(deferredCard).join('')||empty('No founder-approved deferred work is recorded.');complete.innerHTML=data.verified_completion.map(completionCard).join('')||empty('No independently verified completion receipt is available in the current records.');freshness.textContent='Refreshed '+new Date(data.generated_at).toLocaleString()+' · '+data.sources.map(s=>s.path+' @ '+s.sha.slice(0,7)).join(' · ')}catch(error){freshness.textContent=error.message;work.innerHTML=empty('Current work could not be loaded.')}finally{refresh.disabled=false;document.body.classList.remove('loading')}}refresh.onclick=load;document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(tab=>tab.setAttribute('aria-selected',String(tab===button)));document.querySelectorAll('[data-panel]').forEach(panel=>panel.hidden=panel.dataset.panel!==button.dataset.tab)});load();setInterval(load,60000);
</script></body></html>

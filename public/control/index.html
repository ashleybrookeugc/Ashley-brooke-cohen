<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ashley control plane</title>
<style>:root{font-family:Inter,system-ui,sans-serif;color:#211d1d;background:#f7f3ef}*{box-sizing:border-box}body{margin:0}.shell{max-width:1080px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#805d53}h1{margin:.25rem 0}button,textarea{font:inherit}textarea{width:100%;min-height:92px;padding:14px;border:1px solid #cbbdb6;border-radius:12px;background:white}button{border:0;border-radius:999px;padding:9px 14px;background:#2e2927;color:white;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card,.composer{background:white;border:1px solid #e1d7d1;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 3px 14px #5b41320d}.muted{color:#746b67;font-size:.9rem}.route-status{margin:.85rem 0 0;padding:.8rem 1rem;border-radius:12px;background:#f5ede7;color:#4b3a35}.route-status[hidden]{display:none}.route-status details{margin-top:.55rem}.queues{display:grid;grid-template-columns:1fr 1fr;gap:18px}.item{border-top:1px solid #eee2dc;padding:12px 0}.actions{display:flex;gap:8px}.reject{background:#eee5e0;color:#332b28}.refresh{background:#eee5e0;color:#332b28;margin-top:4px}details{font-size:.82rem;color:#746b67}.workers-header{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-top:24px}.workers-header h2{margin-bottom:.2rem}.workers-header p{margin:.2rem 0}.worker-card{position:relative}.worker-topline{display:flex;justify-content:space-between;gap:10px;align-items:center}.worker-state{display:inline-block;border-radius:999px;padding:.25rem .55rem;font-size:.75rem;font-weight:700;text-transform:capitalize;background:#eee5e0}.worker-state-running{background:#dff4e7;color:#185b35}.worker-state-idle{background:#f5edcf;color:#6a5315}.worker-state-completed{background:#e2ebf8;color:#264c7b}.worker-state-blocked{background:#f9dddd;color:#7b2323}.worker-state-disconnected,.worker-state-unknown{background:#ece9e7;color:#625b57}.worker-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.worker-metric{border-radius:10px;background:#f7f3ef;padding:8px;min-width:0}.worker-metric strong,.worker-metric span{display:block;overflow-wrap:anywhere}.worker-result{border-left:3px solid #b98c76;padding-left:10px}.loading:after{content:' …';animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.25}}@media(max-width:700px){.queues{grid-template-columns:1fr}.shell{padding:16px}.workers-header{display:block}.worker-metrics{grid-template-columns:1fr}.worker-topline{align-items:flex-start}}</style></head>
<body><main class="shell"><header><div><div class="eyebrow">Private control plane</div><h1>What’s moving now</h1><p class="muted" id="context-status" aria-live="polite"></p><button class="refresh" id="refresh-context" type="button">Refresh project context</button></div><a href="/admin/logout">Sign out</a></header>
<section class="composer"><label for="thought"><strong>Talk naturally</strong></label><p class="muted">I’ll route the useful part; no filing required.</p><textarea id="thought" placeholder="What changed, what should happen next, or what needs a decision?"></textarea><button id="send">Route this</button><div class="route-status" id="result" aria-live="polite" hidden></div></section>
<section aria-labelledby="workers-heading"><div class="workers-header"><div><h2 id="workers-heading">Worker activity</h2><p class="muted">Read-only status for Mary Kate-managed local workers.</p></div><p class="muted" id="workers-status" aria-live="polite">Checking local workers…</p></div><div class="grid" id="workers" aria-live="polite" aria-busy="true"></div></section>
<h2>Projects</h2><div class="grid" id="projects"></div><div class="queues"><section><h2>Needs Ashley</h2><div id="needs"></div></section><section><h2>AI can handle</h2><div id="ai"></div></section></div><section><h2>Recent outcomes</h2><div id="history"></div></section></main>
<script>
const contextStatus=document.getElementById('context-status');
const refreshContext=document.getElementById('refresh-context');
const thought=document.getElementById('thought');
const send=document.getElementById('send');
const result=document.getElementById('result');
const projects=document.getElementById('projects');
const needs=document.getElementById('needs');
const ai=document.getElementById('ai');
const history=document.getElementById('history');
const workers=document.getElementById('workers');
const workersStatus=document.getElementById('workers-status');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options){const r=await fetch(path,{headers:{'content-type':'application/json'},...options});const data=await r.json();if(!r.ok){const error=Error(data.error||'Request failed');error.code=data.code||'request_failed';error.technical=data.technical;error.action=data.action;throw error}return data}
function showRouteStatus(message,technical=''){result.hidden=false;result.replaceChildren();const copy=document.createElement('div');copy.textContent=message;result.append(copy);if(technical){const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Technical detail';const code=document.createElement('code');code.textContent=typeof technical==='string'?technical:JSON.stringify(technical,null,2);details.append(summary,code);result.append(details)}}
function project(p){return '<article class="card"><div class="eyebrow">'+esc(p['Current stage']||'Active')+'</div><h3>'+esc(p.name)+'</h3><p>'+esc(p['Current objective']||'')+'</p><p class="muted"><strong>Next:</strong> '+esc(p['Next bounded action']||p['Next decision']||'No next action recorded')+'</p></article>'}
function item(x){return '<article class="item"><strong>'+esc(x.plain_summary)+'</strong><p class="muted">'+esc(x.why||'')+'</p><div class="actions"><button data-action="approve" data-id="'+esc(x.id)+'">Approve</button><button class="reject" data-action="reject" data-id="'+esc(x.id)+'">Reject</button></div><details><summary>Proposed change</summary><code>'+esc(JSON.stringify(x.proposal||{},null,2))+'</code></details></article>'}
function historyItem(x){const diagnostic=x.diagnostic?'<details><summary>Routing failure · '+esc(x.id)+'</summary><code>'+esc(JSON.stringify(x.diagnostic,null,2))+'</code></details>':'';const receipt=x.receipt?'<details><summary>Write receipt · '+esc(x.receipt.status||'recorded')+'</summary><code>'+esc(JSON.stringify(x.receipt,null,2))+'</code></details>':'';return '<article class="item"><strong>'+esc(x.plain_summary)+'</strong><p class="muted">'+esc(x.route_kind)+' · '+esc(x.outcome_status||'captured')+'</p>'+diagnostic+receipt+'</article>'}
const workerStateLabel={running:'Running',idle:'Idle',completed:'Execution completed',blocked:'Blocked',disconnected:'Disconnected',unknown:'Unknown'};
function metricValue(value){return value==null?'Unavailable':typeof value==='object'?JSON.stringify(value):String(value)}
function workerCard(worker){const state=workerStateLabel[worker.state]||'Unknown';const latest=worker.progress_events?.at(-1);const progress=latest?'Latest observation: '+(workerStateLabel[latest.state]||'Unknown')+(latest.state_change_seq==null?'':' · sequence '+latest.state_change_seq):'Progress unavailable';const result=worker.state==='completed'?'Worker execution completed. The result has not been independently verified.':worker.state==='disconnected'?'Worker is disconnected and is not active. Result verification is unavailable.':'Result has not been independently verified.';const telemetry=worker.telemetry?.message?'<p class="muted">'+esc(worker.telemetry.message)+'</p>':'';const diagnostics={identity:worker.identity,telemetry:worker.telemetry||{status:'available'},state_source:worker.state_source};return '<article class="card worker-card" data-worker-id="'+esc(worker.id)+'"><div class="worker-topline"><div><div class="eyebrow">'+esc(worker.identity?.agent_name||'Codex worker')+'</div><h3>'+esc(worker.task?.summary||'Task unavailable')+'</h3></div><span class="worker-state worker-state-'+esc(worker.state)+'">'+esc(state)+'</span></div><p class="muted"><strong>Worker:</strong> '+esc(worker.id)+'</p><p>'+esc(progress)+'</p>'+telemetry+'<p class="muted"><strong>Last observed:</strong> '+esc(worker.last_observed_at||'Unavailable')+'</p><div class="worker-metrics"><div class="worker-metric"><strong>Model</strong><span>'+esc(metricValue(worker.runtime_metrics?.model))+'</span></div><div class="worker-metric"><strong>Tokens</strong><span>'+esc(metricValue(worker.runtime_metrics?.tokens))+'</span></div><div class="worker-metric"><strong>Cost</strong><span>'+esc(metricValue(worker.runtime_metrics?.cost))+'</span></div></div><p class="worker-result">'+esc(result)+'</p><details><summary>Technical diagnostics</summary><code>'+esc(JSON.stringify(diagnostics,null,2))+'</code></details></article>'}
function showWorkerMessage(message,technical=''){workers.replaceChildren();const copy=document.createElement('p');copy.className='muted';copy.textContent=message;workers.append(copy);if(technical){const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Technical diagnostics';const code=document.createElement('code');code.textContent=typeof technical==='string'?technical:JSON.stringify(technical,null,2);details.append(summary,code);workers.append(details)}}
async function loadWorkers(initial=false){if(initial){workersStatus.textContent='Checking local workers';workersStatus.className='muted loading';workers.setAttribute('aria-busy','true')}let response;try{response=await fetch('/api/control/workers',{headers:{accept:'application/json'}})}catch(error){workersStatus.textContent='Worker status unavailable';workersStatus.className='muted';workers.setAttribute('aria-busy','false');showWorkerMessage('Mary Kate could not reach the local worker monitor.',{code:'worker_monitor_unreachable'});return false}let data={};try{data=await response.json()}catch{}if(response.status===404||data.enabled===false){workersStatus.textContent='Local monitoring off';workersStatus.className='muted';workers.setAttribute('aria-busy','false');showWorkerMessage('Local worker monitoring is off.');return false}if(!response.ok){workersStatus.textContent='Worker status unavailable';workersStatus.className='muted';workers.setAttribute('aria-busy','false');showWorkerMessage(data.error||'Mary Kate could not read local worker activity right now.',data.technical||data.code);return false}workersStatus.textContent='Read-only · observed '+(data.observed_at||'now');workersStatus.className='muted';workers.setAttribute('aria-busy','false');workers.innerHTML=data.workers?.map(workerCard).join('')||'<p class="muted">No Herdr-managed worker is currently registered.</p>';return data.enabled===true}
async function load(refresh=false){const s=await api('/api/control/state'+(refresh?'?refresh=1':''));contextStatus.textContent='Context '+s.context.status+' · '+s.source.repo+'/'+s.source.path+' @ '+s.source.sha.slice(0,7)+(s.routing_diagnostics?.version==='control-routing-failure.v1'?' · routing diagnostics v1':'')+(s.ambiguity_gate?.version==='authoritative-ambiguity.v1'?' · ambiguity gate v1':'');projects.innerHTML=s.projects.map(project).join('');needs.innerHTML=s.queues.needs_ashley.map(item).join('')||'<p class="muted">Nothing waiting.</p>';ai.innerHTML=s.queues.ai_can_handle.map(item).join('')||'<p class="muted">Nothing queued.</p>';history.innerHTML=s.history.map(historyItem).join('')||'<p class="muted">No interactions yet.</p>'}
refreshContext.onclick=()=>load(true).catch(e=>showRouteStatus(e.message,e.code||'context_refresh_failed'));
send.onclick=async()=>{send.disabled=true;showRouteStatus('Routing request started. The control plane is reading current Project Truth and checking its policy. No change is written unless it creates an approval item.');try{const r=await api('/api/control/interactions',{method:'POST',body:JSON.stringify({text:thought.value})});showRouteStatus('Routing complete — '+r.plain_summary);thought.value='';await load()}catch(e){const contractFailure=/^routing_/.test(e.code||'');const decision=e.action?.prompt?' '+e.action.prompt+(e.action.choices?.length?' Saved options: '+e.action.choices.map(choice=>choice.source+(choice.value?': '+choice.value:'')).join(' | '):''):'';showRouteStatus((contractFailure?'Routing did not produce an approved structured result. No change was saved. You can try again later.':e.message)+decision,contractFailure?(e.technical||e.code):e.technical||e.code||'routing_request_failed');if(contractFailure)await load().catch(()=>{})}finally{send.disabled=false}};
document.body.onclick=async e=>{const b=e.target.closest('[data-action]');if(!b)return;b.disabled=true;try{const r=await api('/api/control/items/'+b.dataset.id+'/'+b.dataset.action,{method:'POST',body:JSON.stringify({note:''})});showRouteStatus(r.message||(r.status==='rejected'?'The change was not approved. Nothing was written.':'Mary Kate made the approved change and confirmed the exact result in GitHub.'));await load()}catch(err){showRouteStatus('Mary Kate could not verify this change as complete. Nothing was recorded as successful.',err.message||err.code||'control_write_failed');b.disabled=false}};
load().catch(e=>showRouteStatus(e.message,e.code||'control_state_unavailable'));
loadWorkers(true).then(enabled=>{if(enabled)setInterval(()=>loadWorkers(false),1500)});
</script></body></html>

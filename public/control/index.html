<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ashley control plane</title>
<style>:root{font-family:Inter,system-ui,sans-serif;color:#211d1d;background:#f7f3ef}*{box-sizing:border-box}body{margin:0}.shell{max-width:1080px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#805d53}h1{margin:.25rem 0}button,textarea{font:inherit}textarea{width:100%;min-height:92px;padding:14px;border:1px solid #cbbdb6;border-radius:12px;background:white}button{border:0;border-radius:999px;padding:9px 14px;background:#2e2927;color:white;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card,.composer{background:white;border:1px solid #e1d7d1;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 3px 14px #5b41320d}.muted{color:#746b67;font-size:.9rem}.route-status{margin:.85rem 0 0;padding:.8rem 1rem;border-radius:12px;background:#f5ede7;color:#4b3a35}.route-status[hidden]{display:none}.route-status details{margin-top:.55rem}.queues{display:grid;grid-template-columns:1fr 1fr;gap:18px}.item{border-top:1px solid #eee2dc;padding:12px 0}.actions{display:flex;gap:8px}.reject{background:#eee5e0;color:#332b28}.refresh{background:#eee5e0;color:#332b28;margin-top:4px}details{font-size:.82rem;color:#746b67}@media(max-width:700px){.queues{grid-template-columns:1fr}.shell{padding:16px}}</style></head>
<body><main class="shell"><header><div><div class="eyebrow">Private control plane</div><h1>What’s moving now</h1><p class="muted" id="context-status" aria-live="polite"></p><button class="refresh" id="refresh-context" type="button">Refresh project context</button></div><a href="/admin/logout">Sign out</a></header>
<section class="composer"><label for="thought"><strong>Talk naturally</strong></label><p class="muted">I’ll route the useful part; no filing required.</p><textarea id="thought" placeholder="What changed, what should happen next, or what needs a decision?"></textarea><button id="send">Route this</button><div class="route-status" id="result" aria-live="polite" hidden></div></section>
<h2>Projects</h2><div class="grid" id="projects"></div><div class="queues"><section><h2>Needs Ashley</h2><div id="needs"></div></section><section><h2>AI can handle</h2><div id="ai"></div></section></div><section><h2>Recent outcomes</h2><div id="history"></div></section></main>
<script>
const contextStatus=document.getElementById('context-status');
const refreshContext=document.getElementById('refresh-context');
const thought=document.getElementById('thought');
const send=document.getElementById('send');
const result=document.getElementById('result');
const projects=document.getElementById('projects');
const needs=document.getElementById('needs');
const ai=document.getElementById('ai');
const history=document.getElementById('history');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options){const r=await fetch(path,{headers:{'content-type':'application/json'},...options});const data=await r.json();if(!r.ok){const error=Error(data.error||'Request failed');error.code=data.code||'request_failed';throw error}return data}
function showRouteStatus(message,technical=''){result.hidden=false;result.replaceChildren();const copy=document.createElement('div');copy.textContent=message;result.append(copy);if(technical){const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Technical detail';const code=document.createElement('code');code.textContent=technical;details.append(summary,code);result.append(details)}}
function project(p){return '<article class="card"><div class="eyebrow">'+esc(p['Current stage']||'Active')+'</div><h3>'+esc(p.name)+'</h3><p>'+esc(p['Current objective']||'')+'</p><p class="muted"><strong>Next:</strong> '+esc(p['Next bounded action']||p['Next decision']||'No next action recorded')+'</p></article>'}
function item(x){return '<article class="item"><strong>'+esc(x.plain_summary)+'</strong><p class="muted">'+esc(x.why||'')+'</p><div class="actions"><button data-action="approve" data-id="'+esc(x.id)+'">Approve</button><button class="reject" data-action="reject" data-id="'+esc(x.id)+'">Reject</button></div><details><summary>Proposed change</summary><code>'+esc(JSON.stringify(x.proposal||{},null,2))+'</code></details></article>'}
function historyItem(x){const receipt=x.receipt?'<details><summary>Write receipt · '+esc(x.receipt.status||'recorded')+'</summary><code>'+esc(JSON.stringify(x.receipt,null,2))+'</code></details>':'';return '<article class="item"><strong>'+esc(x.plain_summary)+'</strong><p class="muted">'+esc(x.route_kind)+' · '+esc(x.outcome_status||'captured')+'</p>'+receipt+'</article>'}
async function load(refresh=false){const s=await api('/api/control/state'+(refresh?'?refresh=1':''));contextStatus.textContent='Context '+s.context.status+' · '+s.source.repo+'/'+s.source.path+' @ '+s.source.sha.slice(0,7);projects.innerHTML=s.projects.map(project).join('');needs.innerHTML=s.queues.needs_ashley.map(item).join('')||'<p class="muted">Nothing waiting.</p>';ai.innerHTML=s.queues.ai_can_handle.map(item).join('')||'<p class="muted">Nothing queued.</p>';history.innerHTML=s.history.map(historyItem).join('')||'<p class="muted">No interactions yet.</p>'}
refreshContext.onclick=()=>load(true).catch(e=>showRouteStatus(e.message,e.code||'context_refresh_failed'));
send.onclick=async()=>{send.disabled=true;showRouteStatus('Routing request started. The control plane is reading current Project Truth and checking its policy. No change is written unless it creates an approval item.');try{const r=await api('/api/control/interactions',{method:'POST',body:JSON.stringify({text:thought.value})});showRouteStatus('Routing complete — '+r.plain_summary);thought.value='';await load()}catch(e){const contractFailure=/^routing_/.test(e.code||'');showRouteStatus(contractFailure?'Routing did not produce an approved structured result. No change was saved. You can try again later.':e.message,contractFailure?e.code:e.code||'routing_request_failed')}finally{send.disabled=false}};
document.body.onclick=async e=>{const b=e.target.closest('[data-action]');if(!b)return;b.disabled=true;try{const r=await api('/api/control/items/'+b.dataset.id+'/'+b.dataset.action,{method:'POST',body:JSON.stringify({note:''})});showRouteStatus(r.message||(r.status==='rejected'?'The change was not approved. Nothing was written.':'Mary Kate made the approved change and confirmed the exact result in GitHub.'));await load()}catch(err){showRouteStatus('Mary Kate could not verify this change as complete. Nothing was recorded as successful.',err.message||err.code||'control_write_failed');b.disabled=false}};
load().catch(e=>result.textContent=e.message);
</script></body></html>

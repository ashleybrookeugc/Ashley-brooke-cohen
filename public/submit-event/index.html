<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submit an event · NYFW Pop-Up Radar</title><link rel="stylesheet" href="/assets/site.css"></head><body class="submission-page"><main class="submission-shell"><a class="back-home" href="/nyfw-pop-ups/">← NYFW Pop-Up Radar</a><p class="eyebrow">COMMUNITY TIP LINE</p><h1>Submit an event</h1><p class="submission-intro">Send the source link you found. We review it before anything is listed.</p><form id="submission-form" class="submission-form"><label>Type<select name="content_type"><option value="event">Event</option><option value="casting">Casting</option></select></label><label>Source URL <span aria-hidden="true">*</span><input name="source_url" type="url" required placeholder="https://"></label><label>Platform<input name="source_platform" placeholder="Instagram, Eventbrite, brand site…"></label><label>Source account/handle<input name="source_handle"></label><label>Event name<input name="event_name"></label><label>Date/time<input name="date_time_text"></label><label>Location/venue<input name="location_text"></label><label>Notes<textarea name="notes" rows="4"></textarea></label><button class="tracker-button" type="submit">Send for review</button><p id="form-result" role="status"></p></form><script>document.querySelector('#submission-form').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/submissions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))}),d=await r.json();if(r.ok)location.href='/submit-event/thanks/';else document.querySelector('#form-result').textContent=d.error||'Could not submit.'})</script></main></body></html>

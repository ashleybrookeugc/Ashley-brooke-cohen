<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submit an event · NYFW Pop-Up Radar</title><link rel="stylesheet" href="/assets/site.css"></head><body class="legal-page"><main class="legal-shell"><a class="back-home" href="/nyfw-pop-ups/">← NYFW Pop-Up Radar</a><h1>Submit an event</h1><p>Send a public source link. Tips are reviewed before anything is listed.</p><form id="submission-form"><p><label>Type <select name="content_type"><option value="event">Event</option><option value="casting">Casting</option></select></label></p><p><label>Source URL *<input name="source_url" type="url" required placeholder="https://"></label></p><p><label>Platform <input name="source_platform" placeholder="Instagram, Eventbrite, brand site…"></label></p><p><label>Source account/handle <input name="source_handle"></label></p><p><label>Event name <input name="event_name"></label></p><p><label>Date/time <input name="date_time_text"></label></p><p><label>Location/venue <input name="location_text"></label></p><p><label>Notes <textarea name="notes"></textarea></label></p><button class="tracker-button" type="submit">Send for review</button><p id="form-result" role="status"></p></form><script>document.querySelector('#submission-form').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/submissions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))}),d=await r.json();document.querySelector('#form-result').textContent=r.ok?'Submitted for review. ID: '+d.submission_id:d.error||'Could not submit.'})</script></main></body></html>

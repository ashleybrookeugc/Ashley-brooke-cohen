<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submission review</title><link rel="stylesheet" href="/assets/site.css"></head><body class="legal-page"><main class="legal-shell"><h1>Submission review</h1><p>Nothing is public until verified and published.</p><div id="items">Loading…</div></main><script>const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function L(){let r=await fetch('/api/admin/submissions');if(!r.ok)return items.textContent='Access is required.';let d=await r.json();items.innerHTML=d.submissions.map(s=>`<article class="event-card"><h2>${E(s.event_name||'Untitled')}</h2><p>${E(s.status)} · ${E(s.content_type)} · ${E(s.created_at)}</p><p><a href="${E(s.source_url)}" target="_blank" rel="noreferrer">Open original source</a></p>${['event_name','date_time_text','location_text','notes','admin_notes'].map(k=>`<label>${k}<textarea data-k="${k}">${E(s[k])}</textarea></label>`).join('')}<p>Possible duplicates: ${E(s.potential_duplicates.map(x=>x.event_name||x.submission_id).join(', ')||'None')}</p><label>Status<select data-k="status">${['pending','under_review','approved','rejected','published'].map(x=>`<option ${x===s.status?'selected':''}>${x}</option>`).join('')}</select></label><label>Verified publication JSON (only for publish)<textarea data-k="review_draft_json">${E(s.review_draft_json||'')}</textarea></label><button data-id="${s.id}">Save review</button></article>`).join('');document.querySelectorAll('button').forEach(b=>b.onclick=async()=>{let a=b.closest('article'),q={};a.querySelectorAll('[data-k]').forEach(x=>q[x.dataset.k]=x.value);r=await fetch('/api/admin/submissions/'+b.dataset.id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify(q)});if(!r.ok)alert((await r.json()).error);else L()})}L()</script></main></body></html>

name: Control plane regressions
on:
  push:
    branches: [main]
    paths: ['tools/video-testing/**','src/control/**','src/control-worker.js','src/auth-worker.js','src/router-worker.js','src/worker.js','public/control/**','migrations/0004_control_plane.sql','test/**','tests/**','package.json','wrangler.jsonc','.github/workflows/control-plane-tests.yml']
  pull_request:
    paths: ['tools/video-testing/**','src/control/**','src/control-worker.js','src/auth-worker.js','src/router-worker.js','src/worker.js','public/control/**','migrations/0004_control_plane.sql','test/**','tests/**','package.json','wrangler.jsonc','.github/workflows/control-plane-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - name: Install media tools for actual audio readback checks
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: npm test
      - run: npm run check:my-work-requirements
      - run: npm run check:worker

name: Control plane regressions
on:
  push:
    branches: [main]
    paths: ['src/control/**','src/control-worker.js','src/auth-worker.js','src/router-worker.js','public/control/**','migrations/0004_control_plane.sql','tests/**','package.json','wrangler.jsonc','.github/workflows/control-plane-tests.yml']
  pull_request:
    paths: ['src/control/**','src/control-worker.js','src/auth-worker.js','src/router-worker.js','public/control/**','migrations/0004_control_plane.sql','tests/**','package.json','wrangler.jsonc']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm test
      - run: npm run check:worker

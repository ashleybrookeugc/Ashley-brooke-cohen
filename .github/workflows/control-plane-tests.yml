name: Control plane regressions
on:
  push:
    branches: [main]
    paths: ['src/control/**','src/control-worker.js','src/auth-worker.js','src/router-worker.js','src/worker.js','public/control/**','migrations/0004_control_plane.sql','test/**','tests/**','eval/**','scripts/eval-phrasing.mjs','package.json','wrangler.jsonc','.github/workflows/control-plane-tests.yml']
  pull_request:
    paths: ['src/control/**','src/control-worker.js','src/auth-worker.js','src/router-worker.js','src/worker.js','public/control/**','migrations/0004_control_plane.sql','test/**','tests/**','eval/**','scripts/eval-phrasing.mjs','package.json','wrangler.jsonc','.github/workflows/control-plane-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npm test
      - run: npm run eval:phrasing
        env:
          PROMPTFOO_DISABLE_TELEMETRY: '1'
          PROMPTFOO_DISABLE_UPDATE: '1'
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          CONTROL_MODEL_API_KEY: ''
      - run: npm run check:my-work-requirements
      - run: npm run check:worker
